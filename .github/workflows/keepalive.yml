name: Keep database awake

# Free Supabase projects pause after 7 days without activity. This pings the server's
# database health check twice a week so boards stay available even when nobody is drawing.
on:
  schedule:
    - cron: "17 9 * * 1,4" # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health/db
        # The free Render server may be asleep: allow up to ~2 minutes for it to wake.
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors \
            --max-time 90 https://whiteboard-server-5x8s.onrender.com/health/db
